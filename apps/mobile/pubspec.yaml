name: planets_mobile
description: "PLANETS mobile bootstrap."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crop_your_image: 2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: 18.0.0
  image: 4.10.1
  image_picker: 1.2.3
  intl: 0.20.3
  sentry_flutter: 9.28.0
  share_plus: 13.0.0
  shared_preferences: 2.5.5
  supabase_flutter: 2.17.2
  timezone: 0.11.1
  uuid: 4.6.0
  url_launcher: 6.3.2
  flutter_map: 8.3.2
  latlong2: 0.9.1

dev_dependencies:
  # Already resolved via Supabase; declares SDK binary-transport test fixtures.
  http: 1.6.0
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/planets-logo.png
    - assets/tutorial/garden-tools.webp
