name: External activity refresh (opt-in)

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply a complete validated import (otherwise dry-run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: external-activities-${{ vars.ACTIVITIES_TARGET || 'unconfigured' }}
  cancel-in-progress: false

jobs:
  refresh:
    # Opt-in, main only; never a PR/fork job. Source rights/enablement remain
    # independent database/code gates. No implicit fetch of every known source.
    if: ${{ github.repository == 'lillo24/planets.community' && github.ref == 'refs/heads/main' && vars.ACTIVITIES_IMPORT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # At most two explicit 4-source/7-minute batches plus setup/receipts.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the bounded importer
        env:
          ACTIVITIES_TARGET: ${{ vars.ACTIVITIES_TARGET }}
          ACTIVITIES_SOURCES: ${{ vars.ACTIVITIES_SOURCES }}
          ACTIVITIES_REFRESH_POLICY_JSON: ${{ secrets.ACTIVITIES_REFRESH_POLICY_JSON }}
          ACTIVITIES_API_URL: ${{ secrets.ACTIVITIES_API_URL }}
          ACTIVITIES_SERVICE_ROLE_KEY: ${{ secrets.ACTIVITIES_SERVICE_ROLE_KEY }}
          IMPORT_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          IMPORT_DUE_ONLY: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IMPORT_APPLY" == 'true' ]]; then
            extra=()
            if [[ "$IMPORT_DUE_ONLY" == 'true' ]]; then extra+=(--due-only); fi
            node scripts/operate-external-activities.mjs --apply --batch-size 4 --target "$ACTIVITIES_TARGET" "${extra[@]}"
          else
            node scripts/operate-external-activities.mjs --dry-run --batch-size 4
          fi
