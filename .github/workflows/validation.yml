name: Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.classify.outputs.mobile }}
      web: ${{ steps.classify.outputs.web }}
      site: ${{ steps.classify.outputs.site }}
      database: ${{ steps.classify.outputs.database }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Classify affected validation areas
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/classify-validation-paths.mjs \
              --all \
              --github-output "$GITHUB_OUTPUT"
          else
            # Treat moves as a removal plus an addition so both owners run.
            git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" | \
              node scripts/classify-validation-paths.mjs \
                --github-output "$GITHUB_OUTPUT"
          fi

  mobile:
    name: Mobile
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Restore Flutter packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate Flutter localizations
        working-directory: apps/mobile
        run: flutter gen-l10n

      - name: Check Dart formatting
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test test_support

      - name: Analyze Flutter application
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test Flutter application
        working-directory: apps/mobile
        run: flutter test

  web:
    name: Web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Restore Node packages
        run: npm ci

      - name: Validate web application
        run: npm run check:web

  site:
    name: Site
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Restore Node packages
        run: npm ci

      - name: Validate public site and waitlist boundary
        run: npm run check:site

  supabase:
    name: Database
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Restore Node packages
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Replay migrations and seed from zero
        run: npm run db:reset

      - name: Lint PLANETS schemas
        run: npm run db:lint

      - name: Run database security advisors
        run: npm run db:advisors

      - name: Run database security tests
        run: npm run db:test

      - name: Verify push delivery worker protocol
        run: npm run push:delivery:verify:local

      - name: Verify local mobile email OTP flow
        run: npm run auth:verify:local

      - name: Verify deterministic local authenticated sessions
        run: npm run auth:session:verify:local

      - name: Verify profile ownership and mixed visibility
        run: npm run profile:verify:local

      - name: Verify proposal ownership, lifecycle, and public privacy
        run: npm run proposal:verify:local

      - name: Verify SIM01 authenticated similar upcoming Proposal matching
        run: npm run proposal:similar:verify:local

      - name: Verify moderation and TW02 authenticated reporting/removal
        run: npm run moderation:verify:local

      - name: Verify TW03 authenticated template copy, retry and removal races
        run: npm run template:apply:verify:local

      - name: Verify DRAFT01 authenticated editor creation, recovery and provenance
        run: npm run draft:editor:verify:local

      - name: Verify recurring activity ownership, recurrence, lifecycle, and privacy
        run: npm run recurring:verify:local

      - name: Verify project participation state, privacy, and lifecycle integration
        run: npm run participation:verify:local

      - name: Verify Project role offer consent and capacity races
        run: npm run project:people:verify:local

      - name: Verify direct participant invitation admission and races
        run: npm run project:participant-invites:verify:local

      - name: Verify participation-aware Browse ordering, filters, and privacy
        run: npm run participation:browse:verify:local

      - name: Verify notification projection, preferences, inbox privacy, and idempotency
        run: npm run notification:verify:local

      - name: Verify push installation, recipient jobs, privacy, and channel independence
        run: npm run push:verify:local

      - name: Verify structured participation-request Messages and privacy
        run: npm run messages:verify:local

      - name: Verify Project chat lifecycle and authorization foundation
        run: npm run project:chat:verify:local

      - name: Verify durable Project chat messages and private Realtime
        run: npm run project:chat:messages:verify:local

      - name: Verify Project chat notification and push fan-out
        run: npm run project:chat:notifications:verify:local

      - name: Verify Scambio-Dona listing lifecycle, discovery, and privacy
        run: npm run resource:listings:verify:local

      - name: Verify Project resource-need lifecycle, privacy, and concurrency
        run: npm run project:resource-needs:verify:local

      - name: Verify explainable Project resource matching and creator authorization
        run: npm run project:resource-matching:verify:local

      - name: Verify join-request contribution selections and concurrency
        run: npm run project:contribution-selections:verify:local

      - name: Generate local web configuration
        run: npm run web:config:local

      - name: Build web application against local Supabase
        run: npm run build --workspace @planets/web

      - name: Verify local web email OTP session
        run: npm run auth:web:verify:local

      - name: Verify public web Tavoli discovery and privacy
        run: npm run tavoli:web:verify:local

      - name: Verify blocking/domain producers and pair serialization
        run: npm run blocking:verify:local

      - name: Verify unrestricted notification projection after domain producers
        run: npm run notification:global:verify:local

      # Both demo histories share one lock/session pool and one combined world.
      - name: Verify combined demo recovery and stability
        run: npm run demo:stack:check:local

      - name: Regenerate public database types
        run: npm run db:types

      - name: Check generated database type drift
        run: git diff --exit-code -- apps/web/src/types/database.generated.ts

      # Two populated predecessor histories each need an additional isolated
      # stack. Keep this release/integration rehearsal in the complete manual gate.
      - name: Verify both divergent populated upgrades
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run template:stack:upgrades:local

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
