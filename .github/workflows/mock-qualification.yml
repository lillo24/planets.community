name: Mock qualification

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-backend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'qa-mock-backend' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Two isolated mock realms
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Guard and broker boundary tests
        run: node --test scripts/mock/*.test.mjs supabase/functions/mock-personas/*.test.mjs
      - name: Genuine Auth, RPC, RLS, Storage and offboarding
        run: node scripts/mock/qualify-local.mjs
