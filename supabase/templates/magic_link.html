<!doctype html>
<html lang="en">
  <body style="font-family: sans-serif; line-height: 1.5">
    <h1>Your PLANETS sign-in code</h1>
    <p>Enter this 6-digit code in the PLANETS app:</p>
    <p style="font-size: 2rem; font-weight: 700; letter-spacing: 0.25rem">
      {{ .Token }}
    </p>
    <p>This code expires after one hour and can be used only to sign in.</p>
    <p>If you did not request it, you can ignore this email. Never share the code.</p>
  </body>
</html>
